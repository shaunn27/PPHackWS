<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Fictional sample for the Snap & Pay demo: a screenshot of a generic
       email app (no real app's branding). Not a real person or business. -->
  <rect width="600" height="800" fill="#ffffff"/>

  <!-- app bar -->
  <rect width="600" height="56" fill="#f6f7f9"/>
  <line x1="0" y1="56" x2="600" y2="56" stroke="#e2e5e9"/>
  <path d="M30 18 L20 28 L30 38" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="42" y="34" font-size="15" fill="#444">Inbox</text>
  <rect x="470" y="20" width="16" height="16" rx="2" fill="none" stroke="#666" stroke-width="2"/>
  <path d="M512 22 h16 v14 h-16 z M512 22 l8 7 l8 -7" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="562" cy="22" r="2" fill="#666"/>
  <circle cx="562" cy="28" r="2" fill="#666"/>
  <circle cx="562" cy="34" r="2" fill="#666"/>

  <!-- subject -->
  <text x="28" y="98" font-size="21" font-weight="700" fill="#1f2328">Invoice HL-2291: October tutoring</text>
  <rect x="28" y="110" width="52" height="20" rx="4" fill="#eef1f5"/>
  <text x="54" y="124" font-size="11" fill="#555" text-anchor="middle">Inbox</text>

  <!-- sender -->
  <circle cx="50" cy="168" r="22" fill="#2f855a"/>
  <text x="50" y="175" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">H</text>
  <text x="84" y="162" font-size="15" font-weight="700" fill="#1f2328">Harbor Lane Tutoring</text>
  <text x="84" y="182" font-size="13" fill="#6b7280">billing@harborlane.example · to me</text>
  <text x="572" y="162" font-size="13" fill="#6b7280" text-anchor="end">Nov 3</text>

  <!-- body -->
  <g font-size="15" fill="#1f2328">
    <text x="28" y="234">Hi Alex,</text>
    <text x="28" y="264">Thanks for another great month with Sam! Here's</text>
    <text x="28" y="286">the summary for October:</text>
  </g>

  <rect x="28" y="304" width="544" height="156" rx="8" fill="#f8f9fb" stroke="#e2e5e9"/>
  <g font-size="14" fill="#333">
    <text x="44" y="334">Math tutoring (6 sessions × $25.00)</text>
    <text x="556" y="334" text-anchor="end">$150.00</text>
    <text x="44" y="362">Practice workbook</text>
    <text x="556" y="362" text-anchor="end">$12.00</text>
    <text x="44" y="390">Sibling discount</text>
    <text x="556" y="390" text-anchor="end" fill="#2f855a">−$12.00</text>
  </g>
  <line x1="44" y1="408" x2="556" y2="408" stroke="#d5d9df"/>
  <text x="44" y="438" font-size="15" font-weight="700" fill="#1f2328">Total due</text>
  <text x="556" y="438" font-size="15" font-weight="700" fill="#1f2328" text-anchor="end">$150.00 USD</text>

  <g font-size="15" fill="#1f2328">
    <text x="28" y="496">Please pay <tspan font-weight="700">$150.00</tspan> by November 20 via PayPal to:</text>
    <text x="28" y="522" font-weight="700" fill="#1d4ed8">sb-acuw253851754@business.example.com</text>
    <text x="28" y="548">and include HL-2291 as the reference.</text>
    <text x="28" y="582">Questions? Just reply to this email.</text>
    <text x="28" y="616">Warm regards,</text>
    <text x="28" y="638">Priya, Harbor Lane Tutoring</text>
  </g>

  <!-- reply / forward -->
  <rect x="28" y="700" width="130" height="44" rx="22" fill="#ffffff" stroke="#c9ced6"/>
  <text x="93" y="727" font-size="15" fill="#333" text-anchor="middle">↩ Reply</text>
  <rect x="172" y="700" width="140" height="44" rx="22" fill="#ffffff" stroke="#c9ced6"/>
  <text x="242" y="727" font-size="15" fill="#333" text-anchor="middle">Forward ↪</text>
</svg>
