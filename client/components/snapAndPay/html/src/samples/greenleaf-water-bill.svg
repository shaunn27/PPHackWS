<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" font-family="Helvetica, Arial, sans-serif">
  <!-- Fictional sample bill for the Snap & Pay demo. Not a real company. -->
  <rect width="600" height="800" fill="#ffffff"/>
  <rect width="600" height="110" fill="#1f7a4d"/>
  <circle cx="62" cy="55" r="28" fill="#ffffff"/>
  <path d="M62 33 C48 52 50 70 62 76 C74 70 76 52 62 33 Z" fill="#1f7a4d"/>
  <text x="104" y="52" font-size="28" font-weight="700" fill="#ffffff">Greenleaf Water Co.</text>
  <text x="104" y="80" font-size="14" fill="#d6f0e2">Clean water, every day · 1 Riverside Way, Springfield</text>

  <text x="40" y="160" font-size="22" font-weight="700" fill="#222">WATER SERVICE BILL</text>
  <text x="40" y="200" font-size="14" fill="#555">Customer</text>
  <text x="40" y="222" font-size="16" fill="#222">Jamie Rivera</text>
  <text x="40" y="244" font-size="14" fill="#555">42 Maple Street, Springfield</text>

  <text x="340" y="200" font-size="14" fill="#555">Account number</text>
  <text x="340" y="222" font-size="16" font-weight="700" fill="#222">GW-204817</text>
  <text x="340" y="252" font-size="14" fill="#555">Bill date</text>
  <text x="460" y="252" font-size="14" fill="#222">2026-11-01</text>
  <text x="340" y="276" font-size="14" fill="#555">Due date</text>
  <text x="460" y="276" font-size="14" font-weight="700" fill="#b3261e">2026-11-30</text>

  <line x1="40" y1="310" x2="560" y2="310" stroke="#ccc"/>
  <text x="40" y="340" font-size="14" font-weight="700" fill="#222">Description</text>
  <text x="560" y="340" font-size="14" font-weight="700" fill="#222" text-anchor="end">Amount</text>
  <text x="40" y="372" font-size="14" fill="#333">Water usage (12.4 m³)</text>
  <text x="560" y="372" font-size="14" fill="#333" text-anchor="end">$31.00</text>
  <text x="40" y="398" font-size="14" fill="#333">Service charge</text>
  <text x="560" y="398" font-size="14" fill="#333" text-anchor="end">$8.50</text>
  <text x="40" y="424" font-size="14" fill="#333">Sales tax</text>
  <text x="560" y="424" font-size="14" fill="#333" text-anchor="end">$3.00</text>
  <line x1="40" y1="444" x2="560" y2="444" stroke="#ccc"/>

  <rect x="300" y="460" width="260" height="70" rx="8" fill="#eef8f2" stroke="#1f7a4d"/>
  <text x="316" y="488" font-size="14" fill="#1f7a4d">TOTAL AMOUNT DUE</text>
  <text x="544" y="518" font-size="26" font-weight="700" fill="#1f7a4d" text-anchor="end">$42.50 USD</text>

  <rect x="40" y="570" width="520" height="120" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="602" font-size="16" font-weight="700" fill="#222">How to pay</text>
  <text x="60" y="632" font-size="14" fill="#333">Pay with PayPal to:</text>
  <text x="60" y="656" font-size="16" font-weight="700" fill="#003087">sb-acuw253851754@business.example.com</text>
  <text x="60" y="678" font-size="12" fill="#555">Please include your account number GW-204817 as the reference.</text>

  <text x="300" y="760" font-size="12" fill="#888" text-anchor="middle">Questions? billing@greenleaf-water.example · Thank you for saving water.</text>
</svg>
